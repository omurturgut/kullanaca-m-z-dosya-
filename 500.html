<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error | Posthumane</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .error-container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        .error-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            position: relative;
        }
        .error-icon::before {
            content: "⚠️";
            font-size: 5rem;
            animation: shake 0.5s ease-in-out infinite alternate;
        }
        @keyframes shake {
            0% { transform: translateX(0) rotate(-5deg); }
            100% { transform: translateX(5px) rotate(5deg); }
        }
        .error-code {
            font-size: clamp(4rem, 10vw, 6rem);
            font-weight: 800;
            color: #ff6b6b;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.4);
        }
        h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            margin: 1.5rem 0 1rem;
            font-weight: 600;
        }
        p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary {
            background: #7dd3c0;
            color: #0a0a0a;
            box-shadow: 0 10px 30px rgba(125, 211, 192, 0.3);
        }
        .btn-primary:hover {
            background: #6cc2af;
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(125, 211, 192, 0.4);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }
        .error-details {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .error-details strong {
            color: rgba(255, 255, 255, 0.9);
        }
        @media (max-width: 768px) {
            .error-container {
                padding: 1.5rem;
            }
            .btn-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon"></div>
        <div class="error-code">500</div>
        <h1>Internal Server Error</h1>
        <p>Something went wrong on our end. Our AI engineers have been notified and are working on fixing this issue.</p>

        <div class="btn-container">
            <a href="/" class="btn btn-primary">Back to Home</a>
            <a href="javascript:location.reload()" class="btn btn-secondary">Try Again</a>
        </div>

        <div class="error-details">
            <strong>What can you do?</strong><br>
            • Refresh the page and try again<br>
            • Check back in a few minutes<br>
            • Contact us if the problem persists<br>
            • Time: <span id="errorTime"></span>
        </div>
    </div>

    <script>
        // Display error time
        document.getElementById('errorTime').textContent = new Date().toLocaleString();

        // Auto-retry after 5 seconds (optional)
        let countdown = 30;
        const tryAgainBtn = document.querySelector('.btn-secondary');
        const originalText = tryAgainBtn.textContent;

        const timer = setInterval(() => {
            countdown--;
            tryAgainBtn.textContent = `Try Again (${countdown}s)`;

            if (countdown <= 0) {
                clearInterval(timer);
                tryAgainBtn.textContent = originalText;
            }
        }, 1000);
    </script>
</body>
</html>
