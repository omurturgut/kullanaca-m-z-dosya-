<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Posthumane</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .error-container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        .error-code {
            font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 800;
            color: #7dd3c0;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 40px rgba(125, 211, 192, 0.4);
            animation: glowPulse 2s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 40px rgba(125, 211, 192, 0.4); }
            50% { text-shadow: 0 0 60px rgba(125, 211, 192, 0.6), 0 0 80px rgba(125, 211, 192, 0.3); }
        }
        h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin: 1.5rem 0 1rem;
            font-weight: 600;
        }
        p {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-block;
            margin-top: 1rem;
            padding: 1rem 2.5rem;
            background: #7dd3c0;
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(125, 211, 192, 0.3);
        }
        .btn-home:hover {
            background: #6cc2af;
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(125, 211, 192, 0.4);
        }
        .btn-home:active {
            transform: translateY(-1px);
        }
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            opacity: 0.3;
        }
        .particle {
            position: absolute;
            background: rgba(125, 211, 192, 0.6);
            border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
        .suggestion-list {
            margin-top: 2rem;
            text-align: left;
            display: inline-block;
        }
        .suggestion-list a {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 0.5rem 0;
            transition: color 0.2s;
        }
        .suggestion-list a:hover {
            color: #7dd3c0;
        }
        .suggestion-list a::before {
            content: "→ ";
            color: #7dd3c0;
            margin-right: 0.5rem;
        }
        @media (max-width: 768px) {
            .error-container {
                padding: 1.5rem;
            }
            .error-code {
                font-size: 6rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation" id="particles"></div>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved. Don't worry, even AI makes mistakes sometimes.</p>
        <a href="/" class="btn-home">Back to Home</a>

        <div class="suggestion-list">
            <a href="/#aboutSection">About Us</a>
            <a href="/#servicesSection">Our Services</a>
            <a href="/#portfolioSection">Portfolio</a>
            <a href="/#pricingSection">Pricing</a>
        </div>
    </div>

    <script>
        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 20;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';

            const size = Math.random() * 4 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDuration = `${Math.random() * 10 + 15}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;

            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
